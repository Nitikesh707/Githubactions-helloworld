name: multiple-jobs

on: push

jobs:
  my-job:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start server
        run: |
          $process = Start-Process node -ArgumentList "server.js" -PassThru
          Start-Sleep 10
          Stop-Process -Id $process.Id
