name: "custom-nodejs"

on: push

jobs:
 first-job:
  runs-on: windows-latest
  steps:
   - name: checkout-registry
     uses: actions/checkout@v7

   - name: download-nodejs
     uses: actions/setup-node@v7
     with:
      node-version: '24'
  
   - name: check-version
     run: node --version

   - name: run-server
     run: node server.js
