name: multiple-jobs

on: push

jobs:

  my-job:
    runs-on: windows-latest

    steps:
      - name: Step 1
        run: Write-Output "This is My Job"

      - name: Step 2
        run: Write-Output "Hello from My Job"


  second-job:
    runs-on: windows-latest

    steps:
      - name: Step 1
        run: Write-Output "This is Second Job"

      - name: Step 2
        run: Write-Output "Hello from Second Job"
