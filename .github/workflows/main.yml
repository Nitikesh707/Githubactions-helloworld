name: system-info

on: push

jobs:
  my-job:
    runs-on: windows-latest

    steps:
      - name: Show message
        run: echo "Hello from GitHub Actions"

      - name: Check PowerShell version
        run: $PSVersionTable.PSVersion

      - name: Show current directory
        run: Get-Location

      - name: List files
        run: Get-ChildItem
